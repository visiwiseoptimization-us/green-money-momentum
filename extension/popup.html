<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="theme.css" />
  </head>

      <div class="brand">Green Money <span class="accent">Momentum</span></div>
      <button class="icon-btn" id="refreshBtn" title="Refresh">⟳</button>

    <div id="statusBanner" class="status-banner" style="display: none"></div>

    <div class="add-row">

    </div>

    <div class="footer">
      <a href="https://www.youtube.com/@GreenMoneyMomentum" target="_blank" rel="noreferrer">youtube.com/@GreenMoneyMomentum</a>
    </div>
